# Builds the Flutter web app and publishes it to GitHub Pages.
#
# One-time setup in the GitHub repository:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > New repository secret
#      MAPBOX_ACCESS_TOKEN: a *public* Mapbox token (pk.…) whose URL
#      restriction is set to your Pages origin, e.g. https://<user>.github.io
#      The token is compiled into the published JavaScript, so never use a
#      secret (sk.…) token here.
#
# The site is served at https://<user>.github.io/<repo>/ so the base href is
# derived from the repository name.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter pub get

      - name: Build web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
